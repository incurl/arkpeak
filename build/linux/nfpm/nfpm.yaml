# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "arkpeak"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "games"
priority: "optional"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: |
  ArkPeak is a cozy procedural town-builder: you place coloured blocks on
  a grid and the town grows around them. The generation is driven by
  Wave Function Collapse.
vendor: "ArkPeak"
homepage: "https://github.com/incurl/arkpeak"
license: "MIT"
release: "1"

contents:
  - src: "./bin/arkpeak"
    dst: "/usr/local/bin/arkpeak"
  - src: "./build/linux/icons/16x16.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/arkpeak.png"
  - src: "./build/linux/icons/32x32.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/arkpeak.png"
  - src: "./build/linux/icons/48x48.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/arkpeak.png"
  - src: "./build/linux/icons/64x64.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/arkpeak.png"
  - src: "./build/linux/icons/128x128.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/arkpeak.png"
  - src: "./build/linux/icons/256x256.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/arkpeak.png"
  - src: "./build/linux/icons/512x512.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/arkpeak.png"
  - src: "./build/linux/arkpeak.desktop"
    dst: "/usr/share/applications/arkpeak.desktop"
  - src: "./LICENSE"
    dst: "/usr/share/doc/arkpeak/copyright"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
