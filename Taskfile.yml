version: '3'

vars:
  APP_NAME: "arkpeak"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  test:
    summary: Runs the Go test suite
    cmds:
      - go test ./internal/... ./...

  test:frontend:
    summary: Type-checks and lints the frontend
    dir: frontend
    cmds:
      - npm run typecheck
      - npm run lint

  bindings:
    summary: Regenerates the TypeScript bindings from the Go services
    description: |
      Wails analyses the Go service methods and writes the matching
      TypeScript into frontend/bindings. `wails3 dev` does this on every
      start, so this task is only needed on a fresh clone or after
      changing a service method's signature.
    cmds:
      - wails3 generate bindings -ts -i

  check:
    summary: Runs every check (Go tests, frontend typecheck and lint)
    cmds:
      - task: test
      - task: test:frontend

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  icon:
    summary: Redraws the application icon
    desc: |
      The icon is drawn by a script rather than by hand, so it can be
      regenerated at any size and changed with the game's palette. The
      PNG it writes is copied into the build assets, and the platform
      icons are derived from it.
    cmds:
      - python3 build/icon/make-icon.py
      - cp build/icon/appicon.png build/appicon.png
      - python3 build/icon/make-platform-icons.py

  verify:package:
    summary: Checks that the build assets carry ArkPeak's identity
    desc: |
      The Wails scaffold ships with placeholder names such as "My Company"
      and "My Product". This fails if any of them have come back, or if
      the Linux desktop entry is not valid.
    cmds:
      - |
        set -e
        # The NSIS script mentions the placeholder names in its comments,
        # as examples of what a build can override. Those are fine.
        found=$(grep -rIl -e 'My Company' -e 'My Product' -e 'com.example.arkpeak' build/ \
          --exclude-dir=node_modules 2>/dev/null | grep -v 'nsis/project.nsi' || true)
        if [ -n "$found" ]; then
          echo "the build assets still carry the scaffold's placeholder names:"
          echo "$found"
          exit 1
        fi
      - desktop-file-validate build/linux/arkpeak.desktop
      - echo "the build assets look right"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
